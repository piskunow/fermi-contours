[tool.poetry]
name = "fermi-contours"
version = "0.2.0"
description = "Fermi Contours"
authors = ["Pablo Piskunow <pablo@piskunow.com>"]
license = "2-Clause BSD License"
readme = "README.md"
homepage = "https://github.com/piskunow/fermi-contours"
repository = "https://github.com/piskunow/fermi-contours"
documentation = "https://fermi-contours.readthedocs.io"
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[tool.poetry.urls]
Changelog = "https://github.com/piskunow/fermi-contours/releases"

# Runtime dependencies. Keep this list limited to what `src/fermi_contours`
# actually imports -- anything added here is imposed on every downstream user
# and pulls that package's advisory surface into this project.
[tool.poetry.dependencies]
python = "^3.11"
click = ">=8.1.7"
numpy = ">=1.26,<3"

[tool.poetry.group.dev.dependencies]
Pygments = ">=2.17"
black = ">=24.3"
coverage = {extras = ["toml"], version = ">=7.4"}
darglint = ">=1.8.1"
flake8 = ">=7.0"
flake8-bandit = ">=4.1.1"
flake8-bugbear = ">=24.2.6"
flake8-docstrings = ">=1.7.0"
flake8-rst-docstrings = ">=0.3.0"
furo = ">=2024.1.29"
isort = ">=5.13"
mypy = ">=1.9"
pep8-naming = ">=0.13.3"
pip-audit = ">=2.7"
pre-commit = ">=3.7"
pre-commit-hooks = ">=4.5"
pytest = ">=8.1"
pyupgrade = ">=3.15"
sphinx = ">=7.2"
sphinx-autobuild = ">=2024.2.4"
sphinx-click = ">=5.1"
typeguard = ">=4.2"
xdoctest = {extras = ["colors"], version = ">=1.1.3"}
myst-parser = {version = ">=2.0"}
autopep8 = ">=2.1"
ipython = ">=8.22"
nox = ">=2024.3.2"
nox-poetry = ">=1.0.3"
ipykernel = ">=6.29"
matplotlib = ">=3.8.3"
nbsphinx = ">=0.9.3"
pandoc = ">=2.3"

[tool.poetry.scripts]
fermi-contours = "fermi_contours.__main__:main"

[tool.coverage.paths]
source = ["src", "*/site-packages"]
tests = ["tests", "*/tests"]

[tool.coverage.run]
branch = true
source = ["fermi_contours", "tests"]

[tool.coverage.report]
show_missing = true
fail_under = 0

[tool.isort]
profile = "black"
force_single_line = true
# `lines_after_imports` is deliberately unset: black decides the count (1 before a
# simple statement, 2 before a def/class). Forcing 2 here makes isort and black
# rewrite each other forever.

[tool.mypy]
strict = true
warn_unreachable = true
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
