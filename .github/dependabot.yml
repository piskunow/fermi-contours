version: 2
updates:
  # Weekly + grouped on purpose: four ecosystems on a daily cadence produced a
  # constant stream of single-dependency PRs. Security advisories are still
  # raised immediately regardless of this schedule.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: "/.github/workflows"
    schedule:
      interval: weekly
    groups:
      ci-tooling:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: "/docs"
    schedule:
      interval: weekly
    groups:
      docs:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    versioning-strategy: lockfile-only
    allow:
      - dependency-type: "all"
    groups:
      python-dependencies:
        patterns: ["*"]
